# Local Git hooks. Install or reinstall with `pnpm install` (runs `lefthook install`).
# CI runs the same checks independently; these hooks only catch problems earlier.

pre-commit:
  parallel: true
  commands:
    lint:
      glob: '*.{ts,js}'
      exclude:
        - 'legacy/**'
        - 'dist/**'
      run: pnpm exec eslint --no-warn-ignored {staged_files}
    format:
      glob: '*.{ts,js,json,md,yml,yaml,html,css}'
      exclude:
        - 'legacy/**'
        - 'dist/**'
      run: pnpm exec prettier --check --ignore-unknown {staged_files}

commit-msg:
  commands:
    conventional:
      run: node scripts/check-commit-msg.js {1}

pre-push:
  commands:
    check:
      run: pnpm check
